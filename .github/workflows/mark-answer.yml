name: Mark SQL answer

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  mark:
    if: >-
      contains(github.event.issue.labels.*.name, 'sql-question') &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'Pm8566'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_CREATED: ${{ github.event.issue.created_at }}
      COMMENT_CREATED: ${{ github.event.comment.created_at }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark the answer
        run: python3 mark.py

      - name: Reply on the issue
        run: gh issue comment "$ISSUE_NUMBER" --body-file reply.txt

      - name: Save the attempt
        run: |
          git config user.name "Pm8566"
          git config user.email "225933735+Pm8566@users.noreply.github.com"
          git add progress
          git commit -m "Answer to issue #$ISSUE_NUMBER: $(cat result.txt)"
          git push

      - name: Close the issue if correct
        run: |
          if [ "$(cat result.txt)" = "CORRECT" ]; then
            gh issue close "$ISSUE_NUMBER"
          fi
