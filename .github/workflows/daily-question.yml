name: Daily SQL question

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Count open questions
        id: open
        run: echo "count=$(gh issue list --label sql-question --state open --json number --jq length)" >> "$GITHUB_OUTPUT"

      - name: Post the next question
        if: steps.open.outputs.count == '0'
        run: |
          python3 post_question.py
          if [ -f title.txt ]; then
            gh label create sql-question --color 1f6feb --force
            gh issue create --title "$(cat title.txt)" --body-file body.txt --label sql-question --assignee Pm8566
          fi
